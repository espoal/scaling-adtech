version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad-bidding-service
    ports:
      - "8080:8080"
    environment:
      - APP_ENVIRONMENT=development
      - APP_LOG_LEVEL=debug
      - SERVER_PORT=8080
      - SERVER_TIMEOUT=30s
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
  postgres:
    image: 'postgres:17.4-alpine'
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ad_bidding
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data/